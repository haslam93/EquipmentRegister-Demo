name: User story
description: A slice of work for the Equipment Register, written so a developer or an agent can pick it up.
title: "[Story] "
labels: ["story"]
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      description: Who needs it, what they need, and why.
      placeholder: |
        As a <role>,
        I want <capability>,
        so that <outcome>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: At least two testable criteria. Cover the main path and one error or edge case. Give exact messages for validation rules.
      placeholder: |
        1. Given ... when ... then ...
        2. Given ... when ... then ...
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Anything deliberately left for a later story.
  - type: input
    id: work-item
    attributes:
      label: Azure Boards work item
      description: Optional. The work item this story came from, for example AB#1234.
      placeholder: AB#
