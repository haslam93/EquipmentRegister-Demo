name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API - build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EquipmentRegister.sln

      - name: Build
        run: dotnet build EquipmentRegister.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test EquipmentRegister.sln --no-build --configuration Release
          --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Coverage summary
        if: always()
        run: |
          report=$(find TestResults -name coverage.cobertura.xml 2>/dev/null | head -n 1)
          if [ -n "$report" ]; then
            rate=$(grep -o 'line-rate="[0-9.]*"' "$report" | head -n 1 | cut -d'"' -f2)
            awk -v r="$rate" 'BEGIN { printf "### API line coverage: %.1f%%\n", r * 100 }' >> "$GITHUB_STEP_SUMMARY"
          fi

  web:
    name: Web - build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm run test:ci

  report-style:
    name: Report style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node tools/check-report-style.mjs
